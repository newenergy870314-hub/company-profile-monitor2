name: Update MOTIR Profile Portal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"  # 매일 06:00 KST

permissions:
  contents: write

concurrency:
  group: motir-profile-portal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python company_profile_portal.py

      - name: Verify generated site
        run: |
          test -s index.html
          grep -q "CLEAN V1" index.html
          grep -q "data-person" index.html
          grep -q "modalBg" index.html
          grep -q "김정관" index.html

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update MOTIR profile portal"
          git push
